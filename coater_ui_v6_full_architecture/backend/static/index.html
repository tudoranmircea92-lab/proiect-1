<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Optimizer Minimal UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 860px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin-top: 8px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 16px; }
    pre { background: #f7f7f7; padding: 12px; overflow: auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body>
  <h1>Coater Optimizer — Minimal UI</h1>

  <div class="card">
    <h3>Run Optimizer</h3>
    <div class="row">
      <div>
        <label>Product</label>
        <input id="product" value="P1" />
      </div>
      <div>
        <label>Day (optional)</label>
        <input id="day" placeholder="2026-01-01" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Target</label>
        <input id="target" value="a_star_RG_mean" />
      </div>
      <div>
        <label>Tolerance</label>
        <input id="tolerance" type="number" step="0.1" value="0.5" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Mode</label>
        <select id="mode">
          <option>SAFE</option>
          <option>AGGRESSIVE</option>
        </select>
      </div>
      <div>
        <label>Train new model</label>
        <select id="train_new_model">
          <option value="true">true</option>
          <option value="false">false</option>
        </select>
      </div>
    </div>
    <label>Active knobs (comma separated, optional)</label>
    <input id="active_knobs" placeholder="c4.pwr,c4.m1g,c4.s1g" />

    <button onclick="runOptimizer()">Run</button>
  </div>

  <div class="card">
    <h3>Verify Applied</h3>
    <div class="row">
      <div>
        <label>Plate ID</label>
        <input id="plate_id" value="plate-001" />
      </div>
      <div>
        <label>Predicted</label>
        <input id="predicted" type="number" step="0.001" value="0.2" />
      </div>
    </div>
    <label>Realized</label>
    <input id="realized" type="number" step="0.001" value="0.25" />
    <button onclick="verifyApplied()">Verify</button>
  </div>

  <div class="card">
    <h3>Output</h3>
    <pre id="output">Ready.</pre>
  </div>

  <script>
    const output = document.getElementById('output');

    async function runOptimizer() {
      const knobsRaw = document.getElementById('active_knobs').value.trim();
      const payload = {
        product: document.getElementById('product').value,
        day: document.getElementById('day').value || null,
        target: document.getElementById('target').value,
        tolerance: Number(document.getElementById('tolerance').value),
        mode: document.getElementById('mode').value,
        train_new_model: document.getElementById('train_new_model').value === 'true',
        active_knobs: knobsRaw ? knobsRaw.split(',').map(v => v.trim()).filter(Boolean) : []
      };
      const res = await fetch('/optimizer/run', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      output.textContent = JSON.stringify(json, null, 2);
    }

    async function verifyApplied() {
      const payload = {
        plate_id: document.getElementById('plate_id').value,
        predicted: Number(document.getElementById('predicted').value),
        realized: Number(document.getElementById('realized').value)
      };
      const res = await fetch('/optimizer/verify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      output.textContent = JSON.stringify(json, null, 2);
    }
  </script>
</body>
</html>
