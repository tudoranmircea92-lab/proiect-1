<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coater Live DB UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background:#0f172a; color:#e2e8f0; }
    header { padding: 16px 20px; border-bottom: 1px solid #1e293b; }
    .tabs { display:flex; gap:8px; padding: 12px 20px; border-bottom:1px solid #1e293b; }
    .tab { padding:10px 14px; border:1px solid #334155; border-radius:8px; background:#111827; color:#93c5fd; }
    .tab.active { background:#1d4ed8; color:white; }
    .container { padding:20px; max-width:980px; }
    .panel { background:#111827; border:1px solid #334155; border-radius:10px; padding:16px; }
    label { display:block; margin:10px 0 4px; }
    input { width:100%; padding:8px; border-radius:6px; border:1px solid #475569; background:#0b1220; color:#e2e8f0; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field-row { display:grid; grid-template-columns:1fr 120px; gap:8px; align-items:center; }
    button { margin-top:14px; margin-right:8px; padding:10px 14px; border:0; border-radius:8px; cursor:pointer; }
    .start { background:#22c55e; color:#04110a; }
    .stop { background:#ef4444; color:white; }
    .browse { background:#334155; color:#e2e8f0; margin-top:0; }
    pre { background:#020617; border:1px solid #334155; border-radius:8px; padding:10px; max-height:300px; overflow:auto; }
    .muted { color:#94a3b8; }
  </style>
</head>
<body>
  <header>
    <h2>Coater Platform UI</h2>
    <div class="muted">Interfață Node.js (extensibilă) – v1 cu tab activ: Create DB Live</div>
  </header>

  <div class="tabs">
    <div class="tab active">Create DB Live</div>
  </div>

  <div class="container">
    <div class="panel">
      <h3>Create DB Live</h3>
      <p class="muted">Pornește/oprește pipeline-ul Python de ingest live în DuckDB.</p>

      <label>Python executable</label>
      <input id="pythonExe" value="python" />

      <label>Optoplex directory</label>
      <div class="field-row"><input id="optoplexDir" placeholder="D:\\optoplex" /><button class="browse" onclick="browsePath('optoplexDir', true)">Browse</button></div>

      <label>Process directory</label>
      <div class="field-row"><input id="processDir" placeholder="D:\\process" /><button class="browse" onclick="browsePath('processDir', true)">Browse</button></div>

      <label>DuckDB path</label>
      <div class="field-row"><input id="dbPath" placeholder="D:\\data\\coater.duckdb" /><button class="browse" onclick="browsePath('dbPath', false)">Browse</button></div>

      <div class="row">
        <div>
          <label>Poll seconds</label>
          <input id="pollSeconds" value="10" />
        </div>
        <div>
          <label>Match window minutes</label>
          <input id="matchWindowMinutes" value="10" />
        </div>
      </div>

      <label>Archive directory (optional)</label>
      <div class="field-row"><input id="archiveDir" placeholder="D:\\archive" /><button class="browse" onclick="browsePath('archiveDir', true)">Browse</button></div>

      <label>Log file (optional)</label>
      <div class="field-row"><input id="logFile" placeholder="D:\\logs\\live_db.log" /><button class="browse" onclick="browsePath('logFile', false)">Browse</button></div>

      <label>One shot (true/false)</label>
      <input id="oneShot" value="false" />

      <div>
        <button class="start" onclick="startRun()">Start</button>
        <button class="stop" onclick="stopRun()">Stop</button>
      </div>

      <p id="status" class="muted">Status: checking...</p>
      <pre id="logs"></pre>
    </div>
  </div>

  <script>
    async function refresh() {
      const r = await fetch('/api/status');
      const s = await r.json();
      document.getElementById('status').innerText = `Status: ${s.running ? 'RUNNING' : 'STOPPED'} ${s.pid ? `(pid=${s.pid})` : ''}`;
      document.getElementById('logs').textContent = (s.logs || []).join('\n');
    }

    async function browsePath(targetInputId, directoriesOnly) {
      let currentPath = document.getElementById(targetInputId).value || '';
      while (true) {
        const r = await fetch(`/api/browse?path=${encodeURIComponent(currentPath)}`);
        const data = await r.json();
        if (!data.ok) {
          alert(`Browse error: ${data.error}`);
          return;
        }

        const filtered = data.items.filter(i => directoriesOnly ? i.isDirectory : (i.isDirectory || i.isFile));
        const lines = filtered.slice(0, 50).map((i, idx) => `${idx + 1}. ${i.isDirectory ? '[DIR]' : '[FILE]'} ${i.name}`);
        const promptText = `Current: ${data.path}\nChoose number, '..' for parent, '.' to select current, or full path:\n\n${lines.join('\n')}`;
        const choice = prompt(promptText, '.');
        if (choice === null) return;
        const input = choice.trim();

        if (input === '.') {
          document.getElementById(targetInputId).value = data.path;
          return;
        }
        if (input === '..') {
          currentPath = data.parent || data.path;
          continue;
        }
        if (/^\d+$/.test(input)) {
          const sel = filtered[Number(input) - 1];
          if (!sel) continue;
          if (sel.isDirectory) {
            currentPath = sel.path;
            continue;
          }
          document.getElementById(targetInputId).value = sel.path;
          return;
        }
        document.getElementById(targetInputId).value = input;
        return;
      }
    }

    async function startRun() {
      const payload = {
        pythonExe: document.getElementById('pythonExe').value,
        optoplexDir: document.getElementById('optoplexDir').value,
        processDir: document.getElementById('processDir').value,
        dbPath: document.getElementById('dbPath').value,
        pollSeconds: Number(document.getElementById('pollSeconds').value || 10),
        matchWindowMinutes: Number(document.getElementById('matchWindowMinutes').value || 10),
        archiveDir: document.getElementById('archiveDir').value || undefined,
        logFile: document.getElementById('logFile').value || undefined,
        oneShot: (document.getElementById('oneShot').value || 'false').toLowerCase() === 'true'
      };
      const r = await fetch('/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      if (!r.ok) alert(data.error || 'Start failed');
      refresh();
    }

    async function stopRun() {
      const r = await fetch('/api/stop', { method: 'POST' });
      const data = await r.json();
      if (!r.ok) alert(data.error || 'Stop failed');
      refresh();
    }

    setInterval(refresh, 2000);
    refresh();
  </script>
</body>
</html>
